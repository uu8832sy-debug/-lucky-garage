<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#090b10" />
  <title>小宇微電｜緊急抽獎碼產生器</title>
  <style>
    :root { color-scheme: dark; --bg:#080b11; --card:#151b2a; --line:#2a3448; --text:#f6f7fb; --muted:#9ca8bd; --green:#16c79a; --yellow:#ffc329; --red:#ff6f86; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif; }
    main { width:min(760px,100%); margin:0 auto; padding:24px 18px 64px; }
    header { display:flex; align-items:center; gap:14px; padding:18px 0 28px; }
    .logo { width:58px; height:58px; border-radius:17px; display:grid; place-items:center; background:var(--green); color:#061019; font-size:25px; font-weight:900; }
    .eyebrow { margin:0 0 4px; color:var(--green); font-weight:800; letter-spacing:.1em; }
    h1 { margin:0; font-size:26px; }
    h2 { margin:0 0 18px; font-size:23px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:26px; padding:24px; margin-bottom:20px; box-shadow:0 18px 55px rgba(0,0,0,.22); }
    .hidden { display:none !important; }
    label { display:block; margin:0 0 16px; font-weight:800; }
    label span { display:block; margin-bottom:9px; }
    input, textarea { width:100%; border:1px solid var(--line); background:#06090f; color:var(--text); border-radius:18px; padding:17px 16px; font:inherit; font-size:18px; outline:none; }
    textarea { min-height:180px; resize:vertical; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
    input:focus, textarea:focus { border-color:var(--green); box-shadow:0 0 0 3px rgba(22,199,154,.12); }
    button { width:100%; border:0; border-radius:18px; padding:17px 16px; font:inherit; font-size:18px; font-weight:900; cursor:pointer; }
    button:disabled { opacity:.55; cursor:wait; }
    .primary { background:linear-gradient(135deg,#ffe05a,var(--yellow)); color:#111827; }
    .secondary { margin-top:12px; background:#2a3141; color:#fff; }
    .login { background:var(--green); color:#061019; }
    .message { min-height:28px; margin:14px 0 0; color:var(--red); font-weight:800; line-height:1.55; white-space:pre-wrap; word-break:break-word; }
    .message.ok { color:var(--green); }
    .note { color:var(--muted); line-height:1.65; }
    .account { display:flex; justify-content:space-between; align-items:center; gap:12px; }
    .account button { width:auto; padding:10px 16px; font-size:15px; }
    .status { padding:14px 16px; border-radius:16px; background:#090e18; border:1px solid var(--line); margin-bottom:18px; line-height:1.55; }
    .code-row { border-top:1px solid var(--line); padding:14px 0; display:grid; gap:5px; }
    .code-row:first-child { border-top:0; }
    code { font-size:18px; font-weight:900; color:#fff; }
    small { color:var(--muted); }
    .badge { display:inline-block; width:max-content; padding:4px 9px; border-radius:999px; background:rgba(22,199,154,.13); color:var(--green); font-weight:800; }
    .danger-note { color:#ffd0d8; background:rgba(255,111,134,.08); border:1px solid rgba(255,111,134,.25); padding:14px 16px; border-radius:16px; line-height:1.6; }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="logo">YU</div>
      <div><p class="eyebrow">EMERGENCY RAFFLE ADMIN</p><h1>一次性抽獎碼產生器</h1></div>
    </header>

    <section id="loginCard" class="card">
      <h2>管理員登入</h2>
      <p class="note">這是全新獨立頁面，不使用舊的 admin.js，也不檢查機率。請使用管理員 Google 帳號。</p>
      <button id="loginBtn" class="login" type="button">使用 Google 登入</button>
      <p id="loginMessage" class="message"></p>
    </section>

    <section id="deniedCard" class="card hidden">
      <h2>沒有管理權限</h2>
      <p id="deniedMessage" class="message"></p>
      <button id="logoutDeniedBtn" class="secondary" type="button">登出並切換帳號</button>
    </section>

    <div id="adminArea" class="hidden">
      <section class="card account">
        <div><p class="eyebrow">管理員已登入</p><strong id="adminEmail">—</strong></div>
        <button id="logoutBtn" class="secondary" type="button">登出</button>
      </section>

      <section class="card">
        <h2>產生一次性抽獎碼</h2>
        <div id="campaignStatus" class="status">尚未讀取活動。</div>
        <label><span>活動 ID</span><input id="campaignId" value="main-2026-v12-final" maxlength="40" autocomplete="off" /></label>
        <label><span>代碼前綴</span><input id="prefix" value="YU" maxlength="6" autocomplete="off" /></label>
        <label><span>產生數量</span><input id="count" type="number" min="1" max="100" value="1" /></label>
        <button id="generateBtn" class="primary" type="button">產生並寫入 Firebase</button>
        <p class="danger-note">此頁只確認活動文件存在，不會比對 500／1000／2000／3000 的權重，也不會建立或修改活動。</p>
        <p id="generateMessage" class="message"></p>
        <textarea id="output" readonly placeholder="新產生的抽獎碼會顯示在這裡"></textarea>
        <button id="copyBtn" class="secondary" type="button">複製抽獎碼</button>
      </section>

      <section class="card">
        <h2>最近抽獎碼</h2>
        <button id="refreshBtn" class="secondary" type="button">重新整理</button>
        <div id="recentList" class="note" style="margin-top:16px">尚未讀取。</div>
      </section>
    </div>
  </main>

  <script src="firebase-config.js?v=202608051627"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
    import {
      getAuth, GoogleAuthProvider, onAuthStateChanged,
      signInWithPopup, signOut
    } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";
    import {
      collection, doc, getDoc, getDocs, getFirestore,
      limit, orderBy, query, serverTimestamp, writeBatch
    } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

    const firebaseConfig = window.LUCKY_GARAGE_FIREBASE_CONFIG || {};
    const OWNER_UIDS = new Set([
      "rN911472GUXjc1IYToSPhgf6zbs2",
      "iRdFBpDpXcNklIQ2tzP8kP1lDu42"
    ]);
    const $ = (s) => document.querySelector(s);
    const loginCard = $("#loginCard");
    const loginBtn = $("#loginBtn");
    const loginMessage = $("#loginMessage");
    const deniedCard = $("#deniedCard");
    const deniedMessage = $("#deniedMessage");
    const adminArea = $("#adminArea");
    const adminEmail = $("#adminEmail");
    const logoutBtn = $("#logoutBtn");
    const logoutDeniedBtn = $("#logoutDeniedBtn");
    const campaignIdInput = $("#campaignId");
    const prefixInput = $("#prefix");
    const countInput = $("#count");
    const generateBtn = $("#generateBtn");
    const generateMessage = $("#generateMessage");
    const campaignStatus = $("#campaignStatus");
    const output = $("#output");
    const copyBtn = $("#copyBtn");
    const refreshBtn = $("#refreshBtn");
    const recentList = $("#recentList");

    function setMessage(el, text, ok = false) {
      el.textContent = text;
      el.classList.toggle("ok", ok);
    }

    function cleanCampaignId(value) {
      return String(value || "").trim().toLowerCase().replace(/[^a-z0-9_-]/g, "").slice(0, 40);
    }

    function normalizeCode(value) {
      return String(value || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
    }

    function randomChars(length) {
      const alphabet = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      const bytes = new Uint8Array(length);
      crypto.getRandomValues(bytes);
      return Array.from(bytes, (b) => alphabet[b % alphabet.length]).join("");
    }

    function makeCode(prefix) {
      return `${prefix}${randomChars(6)}`;
    }

    async function sha256Hex(text) {
      const data = new TextEncoder().encode(text);
      const hash = await crypto.subtle.digest("SHA-256", data);
      return Array.from(new Uint8Array(hash), b => b.toString(16).padStart(2, "0")).join("");
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    if (!firebaseConfig.apiKey || !firebaseConfig.projectId || !firebaseConfig.appId) {
      setMessage(loginMessage, "firebase-config.js 沒有正確載入，請確認它在網站根目錄。", false);
      loginBtn.disabled = true;
      throw new Error("Missing Firebase config");
    }

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    let currentUser = null;
    let lastCodes = [];

    async function isAdmin(user) {
      if (OWNER_UIDS.has(user.uid)) return true;
      const snap = await getDoc(doc(db, "admins", user.uid));
      return snap.exists() && snap.data().enabled === true;
    }

    async function checkCampaign(showError = true) {
      const campaignId = cleanCampaignId(campaignIdInput.value);
      if (!campaignId) {
        campaignStatus.textContent = "請輸入活動 ID。";
        return null;
      }
      try {
        const snap = await getDoc(doc(db, "campaigns", campaignId));
        if (!snap.exists()) {
          campaignStatus.textContent = `找不到活動：${campaignId}`;
          return null;
        }
        const data = snap.data();
        const prizes = Array.isArray(data.prizes) ? data.prizes : [];
        const summary = prizes.map(p => `${p.title || p.id || "獎項"}（權重 ${p.weight ?? "—"}）`).join("、");
        campaignStatus.textContent = `已找到活動：${campaignId}${summary ? `\n${summary}` : ""}`;
        return { id: snap.id, ...data };
      } catch (error) {
        console.error(error);
        campaignStatus.textContent = `讀取活動失敗：${error.code || ""} ${error.message || error}`;
        if (showError) setMessage(generateMessage, campaignStatus.textContent, false);
        return null;
      }
    }

    loginBtn.addEventListener("click", async () => {
      setMessage(loginMessage, "正在開啟 Google 登入…", true);
      try {
        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({ prompt: "select_account" });
        await signInWithPopup(auth, provider);
      } catch (error) {
        console.error(error);
        setMessage(loginMessage, `登入失敗：${error.code || ""}\n${error.message || error}`, false);
      }
    });

    async function doLogout() {
      await signOut(auth);
      location.reload();
    }
    logoutBtn.addEventListener("click", doLogout);
    logoutDeniedBtn.addEventListener("click", doLogout);

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        currentUser = null;
        loginCard.classList.remove("hidden");
        deniedCard.classList.add("hidden");
        adminArea.classList.add("hidden");
        return;
      }
      if (user.isAnonymous) {
        await signOut(auth);
        return;
      }
      currentUser = user;
      try {
        const allowed = await isAdmin(user);
        loginCard.classList.add("hidden");
        if (!allowed) {
          deniedCard.classList.remove("hidden");
          adminArea.classList.add("hidden");
          deniedMessage.textContent = `目前帳號：${user.email || user.uid}\nUID：${user.uid}`;
          return;
        }
        deniedCard.classList.add("hidden");
        adminArea.classList.remove("hidden");
        adminEmail.textContent = user.email || user.uid;
        await checkCampaign(false);
        await refreshCodes();
      } catch (error) {
        console.error(error);
        loginCard.classList.remove("hidden");
        setMessage(loginMessage, `權限檢查失敗：${error.code || ""}\n${error.message || error}`, false);
      }
    });

    campaignIdInput.addEventListener("change", () => checkCampaign(false));

    generateBtn.addEventListener("click", async () => {
      if (!currentUser) return;
      generateBtn.disabled = true;
      output.value = "";
      lastCodes = [];
      setMessage(generateMessage, "正在確認活動並建立抽獎碼…", true);
      try {
        const campaign = await checkCampaign(true);
        if (!campaign) throw new Error("活動不存在或無法讀取。請確認活動 ID。 ");
        const campaignId = campaign.id;
        const prefix = normalizeCode(prefixInput.value).slice(0, 6) || "YU";
        const count = Math.max(1, Math.min(100, Number(countInput.value) || 1));
        const codes = new Set();
        while (codes.size < count) codes.add(makeCode(prefix));
        const records = await Promise.all([...codes].map(async code => ({ code, hash: await sha256Hex(code) })));
        const batch = writeBatch(db);
        for (const record of records) {
          batch.set(doc(db, "drawCodes", record.hash), {
            code: record.code,
            campaignId,
            active: true,
            used: false,
            usedBy: null,
            usedAt: null,
            selectedGarage: null,
            createdAt: serverTimestamp(),
            createdBy: currentUser.uid
          });
        }
        await batch.commit();
        lastCodes = records.map(r => r.code);
        output.value = lastCodes.join("\n");
        setMessage(generateMessage, `成功建立 ${lastCodes.length} 組抽獎碼。`, true);
        await refreshCodes();
      } catch (error) {
        console.error(error);
        setMessage(generateMessage, `產生失敗：${error.code || ""}\n${error.message || error}`, false);
      } finally {
        generateBtn.disabled = false;
      }
    });

    copyBtn.addEventListener("click", async () => {
      const text = output.value.trim();
      if (!text) return setMessage(generateMessage, "目前沒有可複製的抽獎碼。", false);
      try {
        await navigator.clipboard.writeText(text);
        setMessage(generateMessage, "抽獎碼已複製。", true);
      } catch {
        output.focus();
        output.select();
        setMessage(generateMessage, "已選取抽獎碼，請長按複製。", true);
      }
    });

    refreshBtn.addEventListener("click", refreshCodes);

    async function refreshCodes() {
      recentList.textContent = "讀取中…";
      try {
        const snap = await getDocs(query(collection(db, "drawCodes"), orderBy("createdAt", "desc"), limit(30)));
        if (snap.empty) {
          recentList.textContent = "尚無抽獎碼。";
          return;
        }
        recentList.innerHTML = snap.docs.map(d => {
          const x = d.data();
          const status = x.used ? "已使用" : (x.active ? "可使用" : "已停用");
          return `<div class="code-row"><code>${escapeHtml(x.code || d.id)}</code><span class="badge">${escapeHtml(status)}</span><small>活動：${escapeHtml(x.campaignId || "—")}</small></div>`;
        }).join("");
      } catch (error) {
        console.error(error);
        recentList.textContent = `讀取失敗：${error.code || ""} ${error.message || error}`;
      }
    }
  </script>
</body>
</html>
