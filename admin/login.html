<!doctype html>
<html lang="zh-Hant" class="h-full bg-[#070a0f] text-slate-100">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>電動車商家平台｜選擇商家登入</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    .glass{background:rgba(15,23,42,.9);backdrop-filter:blur(18px);border:1px solid rgba(148,163,184,.16)}
    .shop-card{transition:.18s ease;border:1px solid #243047;background:#0b1220}
    .shop-card[data-active="true"]{border-color:#34d399;box-shadow:0 0 0 2px rgba(52,211,153,.12);background:#0d1b1b}
    .shop-logo{background:#fff}
  </style>
</head>
<body class="min-h-full bg-[#070a0f] text-slate-100 antialiased">
  <header class="border-b border-slate-800/90 bg-slate-950/90 backdrop-blur sticky top-0 z-20">
    <div class="max-w-3xl mx-auto px-4 py-4 flex items-center gap-3">
      <span class="w-11 h-11 rounded-2xl bg-emerald-400 text-slate-950 grid place-items-center text-xl"><i class="fa-solid fa-store"></i></span>
      <div><p class="text-[10px] tracking-[.18em] text-emerald-400 font-black">MULTI-SHOP ADMIN</p><h1 class="font-black text-lg">電動車商家後台平台</h1></div>
    </div>
  </header>

  <main class="max-w-3xl mx-auto p-4 sm:p-6 pb-12">
    <section class="glass rounded-[28px] p-5 sm:p-7 mt-4 space-y-6">
      <div>
        <p class="text-emerald-400 text-xs font-black">STEP 1</p>
        <h2 class="text-2xl font-black mt-1">先選擇要登入的商家</h2>
        <p class="text-slate-400 text-sm mt-2 leading-6">小宇、傑瑞以及未來新增的合作車行都從這裡進入。各店商品、圖片、訂單與設定分開。</p>
      </div>

      <div id="shopLoading" class="text-sm text-slate-500 py-5 text-center">正在載入商家清單…</div>
      <div id="shopGrid" class="hidden grid sm:grid-cols-2 gap-3"></div>

      <label class="block space-y-2">
        <span class="text-xs text-slate-400 font-bold">商家下拉選擇</span>
        <select id="shopSelect" class="w-full bg-slate-950 border border-slate-700 rounded-2xl px-4 py-4 text-base font-black outline-none focus:border-emerald-400"></select>
      </label>
    </section>

    <section class="glass rounded-[28px] p-5 sm:p-7 mt-4 space-y-5">
      <div>
        <p class="text-sky-400 text-xs font-black">STEP 2</p>
        <h2 id="loginHeading" class="text-2xl font-black mt-1">登入所選商家</h2>
        <p id="selectedShopHint" class="text-slate-400 text-sm mt-2">請先選擇商家。</p>
      </div>

      <div id="signedInBox" class="hidden rounded-2xl border border-emerald-500/30 bg-emerald-500/10 p-4">
        <p class="text-xs text-emerald-300 font-bold">目前已登入</p>
        <p id="signedInEmail" class="font-black mt-1 break-all"></p>
        <div class="grid sm:grid-cols-2 gap-2 mt-4">
          <button id="enterSelectedBtn" class="bg-emerald-400 text-slate-950 font-black rounded-xl py-3">進入所選商家</button>
          <button id="signOutBtn" class="bg-slate-800 border border-slate-700 font-bold rounded-xl py-3">換帳號登入</button>
        </div>
      </div>

      <div id="loginFields" class="space-y-3">
        <input id="emailInput" type="email" autocomplete="username" placeholder="管理員 Email" class="w-full bg-slate-950 border border-slate-700 rounded-2xl px-4 py-4 outline-none focus:border-emerald-400" />
        <input id="passwordInput" type="password" autocomplete="current-password" placeholder="密碼" class="w-full bg-slate-950 border border-slate-700 rounded-2xl px-4 py-4 outline-none focus:border-emerald-400" />
        <button id="emailLoginBtn" class="w-full bg-emerald-400 text-slate-950 font-black rounded-2xl py-4 text-lg"><i class="fa-solid fa-right-to-bracket mr-2"></i>Email／密碼登入</button>
        <div class="text-center text-xs text-slate-600">或</div>
        <button id="googleLoginBtn" class="w-full bg-sky-500 text-white font-black rounded-2xl py-4 text-lg"><i class="fa-brands fa-google mr-2"></i>使用 Google 登入</button>
      </div>

      <div id="status" class="hidden rounded-2xl border p-4 text-sm leading-6"></div>
      <p class="text-[11px] text-slate-600 leading-5">店家帳號即使選錯商家，系統仍會依帳號綁定的 shopId 導回自己的店；平台總管理員才可切換不同商家。</p>
    </section>
  </main>

  <script src="../firebase-config.js?v=12.2"></script>
  <script type="module" src="login.js?v=1"></script>
</body>
</html>
