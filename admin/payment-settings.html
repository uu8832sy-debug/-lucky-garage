<!doctype html>
<html lang="zh-Hant" class="h-full bg-slate-950 text-slate-100">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>金流／分期設定｜管理後台</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="min-h-full bg-slate-950 text-slate-100">
<main class="max-w-4xl mx-auto p-4 sm:p-7 space-y-5">
  <div class="flex items-center justify-between gap-4"><div><p class="text-xs text-emerald-400 font-black">PAYMENT SETTINGS</p><h1 class="text-2xl font-black">金流／分期設定</h1></div><a href="index.html" class="bg-slate-900 border border-slate-700 px-4 py-2 rounded-xl text-sm">← 回後台</a></div>
  <section id="gate" class="bg-slate-900 border border-slate-800 rounded-3xl p-6 text-slate-400">正在確認管理員權限…</section>
  <section id="editor" class="hidden bg-slate-900 border border-slate-800 rounded-3xl p-5 sm:p-7 space-y-6">
    <div class="text-xs text-slate-400">目前店家：<b id="shopName" class="text-emerald-400"></b></div>
    <div class="grid sm:grid-cols-2 gap-4">
      <label><span class="block text-xs font-bold mb-1">信用卡加價（%）</span><input id="cardSurcharge" type="number" min="0" step="0.01" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3"></label>
      <label><span class="block text-xs font-bold mb-1">最低刷卡金額</span><input id="minimumCardAmount" type="number" min="0" step="1" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3"></label>
      <label><span class="block text-xs font-bold mb-1">預設頭期款</span><input id="defaultDownPayment" type="number" min="0" step="1" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3"></label>
      <label class="flex items-center gap-3 sm:mt-6"><input id="roundAmounts" type="checkbox" class="accent-emerald-500 w-5 h-5"><span class="text-sm font-bold">金額四捨五入為整數</span></label>
    </div>
    <div><h2 class="font-black mb-3">各期數手續費／利率</h2><p class="text-xs text-slate-400 mb-4">百分比以「整段分期的總加價」計算，例如 12% 表示分期本金 × 1.12。</p><div id="plans" class="grid sm:grid-cols-2 gap-3"></div></div>
    <button id="saveBtn" class="w-full bg-emerald-500 text-slate-950 font-black py-3 rounded-xl">儲存金流設定</button><div id="status" class="hidden rounded-xl p-4 text-sm bg-slate-950 border border-slate-800"></div>
  </section>
</main><script src="../firebase-config.js"></script><script type="module" src="payment-settings.js"></script></body></html>
