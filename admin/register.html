<!doctype html>
<html lang="zh-Hant" class="h-full bg-[#080a0f] text-slate-100">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>代理店管理員註冊</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-full antialiased">
  <main class="max-w-lg mx-auto p-5 sm:p-8">
    <div class="mb-6"><p class="text-xs text-emerald-400 font-bold">ADMIN INVITE</p><h1 class="text-2xl font-black">設定管理員帳號</h1></div>

    <section class="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-4">
      <div id="registerForm" class="space-y-4">
        <label class="block"><span class="text-xs font-bold block mb-1">受邀 Email</span><input id="emailInput" type="email" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3" /></label>
        <label class="block"><span class="text-xs font-bold block mb-1">設定密碼</span><input id="passwordInput" type="password" minlength="8" placeholder="至少 8 碼" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3" /></label>
        <button id="registerBtn" class="w-full bg-emerald-500 text-slate-950 font-black py-3 rounded-xl">建立帳號並寄驗證信</button>
      </div>

      <div id="verifyBox" class="hidden space-y-3">
        <p class="text-sm text-slate-300">驗證信已寄出。請先到信箱完成驗證，再回來按下面按鈕。</p>
        <button id="verifyBtn" class="w-full bg-emerald-500 text-slate-950 font-black py-3 rounded-xl">我已完成 Email 驗證</button>
      </div>

      <div id="result" class="hidden whitespace-pre-wrap break-all text-sm rounded-xl bg-slate-950 border border-slate-800 p-4"></div>
      <a id="adminLink" href="index.html" class="hidden w-full text-center bg-slate-800 border border-slate-700 py-3 rounded-xl font-bold">進入後台</a>
    </section>
  </main>

  <script src="../firebase-config.js"></script>
  <script type="module" src="register.js"></script>
</body>
</html>
