<!doctype html>
<html lang="zh-Hant" class="h-full bg-[#080a0f] text-slate-100">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>代理店管理｜小宇微電</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>.glass{background:rgba(15,23,42,.9);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.08)}</style>
</head>
<body class="min-h-full bg-slate-950 text-slate-100">
  <header class="border-b border-slate-800 bg-slate-900/90 sticky top-0 z-20 backdrop-blur">
    <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
      <div><p class="text-[10px] text-emerald-400 font-bold">PLATFORM OWNER</p><h1 class="font-black">代理店管理</h1></div>
      <a href="index.html" class="text-xs bg-slate-800 border border-slate-700 px-3 py-2 rounded-xl">← 回後台</a>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 sm:p-6 space-y-6">
    <section id="authGate" class="glass rounded-3xl p-6 text-sm text-slate-400">正在確認平台權限…</section>

    <section id="platformApp" class="hidden space-y-6">
      <div class="glass rounded-3xl p-6 space-y-5">
        <div><p class="text-xs text-emerald-400 font-bold">NEW SHOP</p><h2 class="text-xl font-black">建立代理車行</h2><p class="text-xs text-slate-400 mt-1">建立後，該帳號登入共用後台只會看到自己的 shopId 資料。</p></div>

        <div class="grid sm:grid-cols-2 gap-4">
          <label class="space-y-1"><span class="text-xs font-bold">shopId</span><input id="shopId" value="jerry" placeholder="例如 jerry" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3" /></label>
          <label class="space-y-1"><span class="text-xs font-bold">店家名稱</span><input id="shopName" value="傑瑞電動車" placeholder="例如 傑瑞電動車" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3" /></label>
          <label class="space-y-1"><span class="text-xs font-bold">管理員 Email</span><input id="adminEmail" type="email" autocomplete="off" placeholder="店家管理員 Email" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3" /></label>
          <label class="space-y-1"><span class="text-xs font-bold">初始密碼</span><input id="adminPassword" type="password" autocomplete="new-password" placeholder="至少 6 碼" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3" /></label>
          <label class="space-y-1 sm:col-span-2"><span class="text-xs font-bold">前台網址（可稍後補）</span><input id="siteUrl" placeholder="https://..." class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3" /></label>
        </div>

        <button id="createShopBtn" class="w-full bg-emerald-500 text-slate-950 font-black py-3 rounded-xl"><i class="fa-solid fa-store mr-2"></i>建立車行＋管理員帳號</button>
        <div id="status" class="hidden rounded-2xl border p-4 text-sm"></div>
      </div>

      <div class="glass rounded-3xl p-6">
        <h3 class="font-black mb-3">建立完成後的資料結構</h3>
        <pre class="text-xs text-slate-400 whitespace-pre-wrap">shops/{shopId}
adminAccounts/{uid} → shopId
shops/{shopId}/products
shops/{shopId}/orders
shops/{shopId}/siteSettings
shops/{shopId}/deliveryCases
Storage: shops/{shopId}/products/...</pre>
      </div>
    </section>
  </main>

  <script src="../firebase-config.js?v=12.2"></script>
  <script type="module" src="platform.js?v=1"></script>
</body>
</html>
