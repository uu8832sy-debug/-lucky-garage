  <section class="wrap section" style="padding-top:12px">
    <div class="filters" aria-label="商品篩選"><button class="filter-btn active" data-filter="all">全部車款</button><button class="filter-btn" data-filter="72V">72V</button><button class="filter-btn" data-filter="60V">60V</button><button class="filter-btn" data-filter="48V">48V</button><button class="filter-btn" data-filter="展示">三輪／場域用</button></div>

<div id="productModal" class="modal" aria-hidden="true"><section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <header class="modal-head"><h2 id="modalTitle">車款詳情與訂購</h2><button id="closeModal" class="icon-btn" type="button" aria-label="關閉">✕</button></header>
  <div class="modal-layout">
    <div><div class="gallery-main"><img id="mainPhoto" src="" alt="車款照片"></div><div id="thumbs" class="thumbs"></div></div>
    <div class="details"><p id="modalStyle" class="eyebrow"></p><h3 id="modalName"></h3><p id="modalNote" class="note"></p>
      <div class="detail-list"><div><small>電池</small><strong id="modalBattery">—</strong></div><div><small>馬達</small><strong id="modalMotor">—</strong></div><div><small>速度</small><strong id="modalSpeed">—</strong></div><div><small>續航</small><strong id="modalRange">—</strong></div></div>
      <form id="orderForm" class="order-form">
        <div class="form-grid"><label class="field"><span>電池版本</span><select id="variant" required></select></label><label class="field"><span>顏色</span><select id="color" required></select></label></div>
        <div class="form-grid"><label class="field"><span>姓名 *</span><input id="customerName" maxlength="40" autocomplete="name" required></label><label class="field"><span>手機 *</span><input id="phone" inputmode="tel" maxlength="20" autocomplete="tel" required></label></div>
        <label class="field"><span>送車地址 *</span><input id="address" maxlength="180" autocomplete="street-address" required></label>
        <label class="field"><span>備註</span><textarea id="customerNote" rows="2" maxlength="160" placeholder="例如：想了解無卡分期、指定顏色或交車時間"></textarea></label>
        <input id="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true">
        <div class="form-grid"><label class="field"><span id="captchaQuestion">驗證</span><input id="captchaAnswer" inputmode="numeric" required></label><div class="total-box"><span>參考售價</span><strong id="total">NT$0</strong></div></div>
        <button id="submitOrder" class="btn btn-primary" type="submit">送出訂單需求並開啟 LINE</button><small style="color:#94a3b8">送出後會建立「待訂金」訂單，實際訂金、交期及配備由客服再次確認。</small>
      </form>
    </div>
  </div>
</section></div>
