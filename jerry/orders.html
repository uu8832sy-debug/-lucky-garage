<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta name="theme-color" content="#07111f" />
  <title>傑瑞電動車｜完整訂單管理</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:#07101c;color:#eaf2ff}button,input,select,textarea{font:inherit}.wrap{width:min(1180px,calc(100% - 28px));margin:auto}.top{position:sticky;top:0;z-index:30;background:rgba(7,16,28,.94);backdrop-filter:blur(16px);border-bottom:1px solid #1e3148}.topin{min-height:70px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:44px;height:44px;border-radius:12px;background:#fff;object-fit:contain}.brand small{display:block;color:#52a7ff;font-weight:900;letter-spacing:.08em}.brand strong{font-size:17px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:900;cursor:pointer}.btn.blue{background:#1587ff;color:#fff}.btn.green{background:#18c48f;color:#061a15}.btn.dark{background:#132237;color:#dcecff;border:1px solid #29425f}.btn.red{background:#ef5364;color:#fff}.btn:disabled{opacity:.5;cursor:not-allowed}.card{background:#0e1a2b;border:1px solid #213750;border-radius:20px;padding:18px}.hidden{display:none!important}.login{max-width:470px;margin:70px auto;text-align:center}.login img{width:86px;height:86px;border-radius:22px;background:#fff;object-fit:contain}.login input{width:100%;margin-top:10px;background:#07101c;color:#fff;border:1px solid #2a425d;border-radius:13px;padding:13px}.login .btn{width:100%;margin-top:12px}.muted{color:#88a0bb}.message{min-height:22px;color:#ff9aa6}.app{padding:22px 0 60px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.stat span{display:block;color:#89a2be;font-size:12px}.stat b{display:block;margin-top:8px;font-size:24px}.toolbar{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:12px}.toolbar h2{margin:4px 0 0}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters input,.filters select{background:#081321;color:#fff;border:1px solid #29425f;border-radius:11px;padding:10px}.tablebox{overflow:auto;padding:0}.orders{width:100%;border-collapse:collapse;min-width:960px}.orders th,.orders td{padding:12px;border-bottom:1px solid #1c3047;text-align:left;font-size:13px;vertical-align:middle}.orders th{color:#7f9ab8;font-size:11px;letter-spacing:.05em}.orders td strong{display:block;color:#fff}.orders td small{display:block;color:#7890aa;margin-top:3px}.status{background:#081321;color:#fff;border:1px solid #2b455f;border-radius:9px;padding:8px}.money{font-weight:900}.due{color:#ffbf6b}.rowactions{display:flex;gap:6px}.empty{text-align:center;color:#7690ac;padding:30px}.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.76);display:grid;place-items:center;padding:16px}.dialog{width:min(820px,100%);max-height:92vh;overflow:auto;background:#0b1727;border:1px solid #2a425e;border-radius:24px;padding:20px}.dialoghead{display:flex;justify-content:space-between;align-items:center;gap:12px}.dialog h3{margin:0;font-size:22px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}.grid label{display:block;color:#8fa8c3;font-size:12px}.grid input,.grid select,.grid textarea{width:100%;margin-top:6px;background:#06101d;color:#fff;border:1px solid #2a425d;border-radius:11px;padding:11px}.grid .full{grid-column:1/-1}.preview{margin-top:14px;padding:14px;border-radius:14px;background:#07121f;display:flex;justify-content:space-between;gap:12px}.preview b{font-size:18px}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}.note{font-size:12px;color:#7993af;line-height:1.6}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#15314f;color:#8cc8ff;font-size:11px;font-weight:900}.toast{position:fixed;left:50%;bottom:24px;z-index:100;transform:translate(-50%,120px);opacity:0;background:#fff;color:#08111f;padding:12px 18px;border-radius:999px;font-weight:900;transition:.25s}.toast.show{transform:translate(-50%,0);opacity:1}@media(max-width:760px){.topin{align-items:flex-start;padding:12px 0}.actions{justify-content:flex-end}.stats{grid-template-columns:repeat(2,1fr)}.toolbar{align-items:stretch;flex-direction:column}.filters>*{flex:1}.grid{grid-template-columns:1fr}.grid .full{grid-column:auto}.dialog{padding:16px}.stat b{font-size:20px}}
  </style>
</head>
<body>
<header class="top"><div class="wrap topin"><div class="brand"><img src="/jerry/admin-logo.png" alt="Jerry E-Bike"><div><small>JERRY ADMINISTRATION</small><strong>完整訂單管理</strong></div></div><div class="actions"><a class="btn dark" href="/jerry/admin.html?shop=jerry" style="text-decoration:none">← 後台首頁</a><a class="btn dark" href="/jerry/" target="_blank" style="text-decoration:none">查看前台 ↗</a><button id="logoutBtn" class="btn dark hidden">登出</button></div></div></header>
<main class="wrap">
  <section id="loginCard" class="card login"><img src="/jerry/admin-logo.png" alt="Jerry E-Bike"><h1>傑瑞完整訂單管理</h1><p class="muted">登入後只讀取 <b>傑瑞電動車</b> 的訂單。</p><input id="emailInput" type="email" autocomplete="username" placeholder="管理員 Email"><input id="passwordInput" type="password" autocomplete="current-password" placeholder="密碼"><button id="loginBtn" class="btn green">Email／密碼登入</button><p id="loginMessage" class="message"></p></section>
  <section id="deniedCard" class="card login hidden"><h2>此帳號沒有傑瑞訂單權限</h2><p id="deniedText" class="muted"></p></section>
  <div id="app" class="app hidden">
    <div class="stats"><article class="card stat"><span>訂單總數</span><b id="statTotal">0</b></article><article class="card stat"><span>待處理／待交車</span><b id="statPending">0</b></article><article class="card stat"><span>已收款</span><b id="statReceived">NT$0</b></article><article class="card stat"><span>待收尾款</span><b id="statDue">NT$0</b></article></div>
    <section class="card">
      <div class="toolbar"><div><span class="badge">JERRY ORDERS</span><h2>全部訂單</h2></div><div class="filters"><input id="searchInput" type="search" placeholder="姓名／電話／車款／訂單編號"><select id="filterStatus"><option value="">全部狀態</option><option>待驗證</option><option>待訂金</option><option>已付訂金</option><option>備車中</option><option>待交車</option><option>已交車</option><option>取消</option></select><button id="newBtn" class="btn blue">＋ 手動新增</button><button id="refreshBtn" class="btn dark">重新整理</button></div></div>
      <div class="tablebox"><table class="orders"><thead><tr><th>訂單</th><th>客戶</th><th>車款／規格</th><th>金額</th><th>收款</th><th>付款</th><th>狀態</th><th>操作</th></tr></thead><tbody id="orderBody"><tr><td colspan="8" class="empty">讀取中…</td></tr></tbody></table></div>
    </section>
  </div>
</main>
<div id="orderModal" class="modal hidden"><section class="dialog"><div class="dialoghead"><div><small class="muted">JERRY ORDER</small><h3 id="formTitle">建立訂單</h3></div><button id="closeBtn" class="btn dark">✕</button></div><form id="orderForm"><input id="editId" type="hidden"><div class="grid">
<label>客戶姓名<input id="customerName" required maxlength="40"></label><label>手機<input id="phone" required maxlength="20" inputmode="tel"></label><label class="full">地址／取車資訊<input id="address" required maxlength="180"></label>
<label>車款<select id="model" required></select></label><label>電池規格／版本<select id="variant" required></select></label><label>顏色<input id="color" maxlength="40" placeholder="待確認"></label><label>成交總價<input id="price" type="number" min="0" step="1"></label>
<label>領牌方式<select id="licenseMode"><option>代辦</option><option>自行辦理</option></select></label><label>交車方式<select id="deliveryMode"><option>門市自取</option><option>配送／送車</option></select></label><label>付款方式<select id="paymentMethod"><option>現金／轉帳</option><option>現金</option><option>轉帳</option><option>信用卡</option><option>分期</option><option>LINE Pay</option></select></label><label>訂單狀態<select id="status"><option>待驗證</option><option>待訂金</option><option>已付訂金</option><option>備車中</option><option>待交車</option><option>已交車</option><option>取消</option></select></label>
<label>已收訂金<input id="deposit" type="number" min="0" step="1"></label><label>已收尾款<input id="balancePaid" type="number" min="0" step="1"></label><label>實際交車日<input id="deliveredAt" type="date"></label><label>驗證碼<input id="verificationCode" readonly></label><label class="full">備註<textarea id="notes" rows="3" maxlength="500"></textarea></label>
</div><div class="preview"><span>目前待收</span><b id="duePreview">NT$0</b></div><p class="note">車款／規格會依傑瑞目前正式價目表自動帶入售價；成交總價仍可自行修改。代辦領牌、刷卡加價等以實際成交內容為準。</p><div class="modalactions"><button id="deleteBtn" type="button" class="btn red hidden">刪除訂單</button><button id="copyBtn" type="button" class="btn dark">複製 LINE 摘要</button><button id="saveBtn" type="submit" class="btn green">儲存訂單</button></div><p id="formMessage" class="message"></p></form></section></div>
<div id="toast" class="toast"></div>
<script src="/firebase-config.js"></script><script type="module" src="/jerry/orders.js?v=1"></script>
</body></html>
