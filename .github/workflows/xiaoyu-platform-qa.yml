name: Xiaoyu Platform QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and verify Xiaoyu platform
        run: npm run build
